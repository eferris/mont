<script type="module">

  import { stateTeacher } from './state.js';
  import { stateStudent } from './state.js';
  import { stateSubject } from './state.js';
  import { stateLesson } from './state.js';



const PROMPT = "-- Select an Option --";
let itemList = 0;  
let selectedValue = '';    

// 1. Data source for options
const optionsData = [
  { value: '', text: PROMPT }
];

// REPLACE THIS with your actual remote server IP or domain name
const DATA_URL = "http://localhost:8000/Data";
const SIGNIN_URL = "http://localhost:8000/SignIn";
const CURRICULUM_URL = "http://localhost:8000/Curriculum";
const PAGE_URL = "http://localhost:8000/Page";
const SUBJECT_URL = "http://localhost:8000/Subject";
const PREREQUISITE_URL = "http://localhost:8000/Prerequisite";
const REPORT_URL = "http://localhost:8000/Report";
const POSTER_URL = "http://localhost:8000/Poster";
const MATERIAL_URL = "http://localhost:8000/Material";
const STUDENT_URL = "http://localhost:8000/Student";
const LESSON_URL = "http://localhost:8000/Lesson";
const TEACHER_URL = "http://localhost:8000/Teacher";


if (window.appStatus) {    // check glocal state

  console.log('entered again on appStatus being set')

} 
document.body.innerHTML = renderLoginScreen();

const output = document.getElementById("output");
const button = document.getElementById("fetchBtn");

button.addEventListener("click", async () => {

    const inputEl = document.getElementById('email');            
    const textValue = inputEl.value.trim();
    // 2. Check if the string is empty
    if (textValue === '') {
        output.textContent = `email is missing`;
        return;
    }

    try {

        output.textContent = "";
        // Perform the asynchronous AJAX call to the remote FastAPI server
        const response = await fetch(DATA_URL);

        if (!response.ok) {
        output.textContent = "Server returned status: ${response.status}";                  
            throw new Error(`Server returned status: ${response.status}`);
        }

        const data = await response.json();

        // Step 1: Unwrap the outer JSON string
        const decodedString = JSON.parse(data);

        // Step 2: Parse the resulting string into a real JavaScript Array

        let count = decodedString.length;
        // output.textContent = `Fetched ${count} Administrators.`;

        const selectContainer = document.createElement('select');
        selectContainer.id = 'select-container';

        optionsData.push({  value: '', text: '-- Select an Option --' });

        const option = document.createElement('option');
        option.value = '';
        option.text = '-- Select an Option --';

        // Append the default option to the element
        selectContainer.appendChild(option);

        // Step 3: Iterate through the elements cleanly
        for (const item of decodedString) {
          // console.log(item);


          optionsData.push({ value: item, text: item });

          const option = document.createElement('option');
          option.value = item;
          option.text = item;

          // 5. Append the <select> element to the DOM
          selectContainer.appendChild(option);
        }
        const container = document.getElementById('select-div');
        container.innerHTML = ''; // Clear previous content
        container.appendChild(selectContainer);
        selectContainer.addEventListener('change', (event) => {
            selectedValue = event.target.value;
            if (selectedValue === PROMPT ) {
                output.textContent = "Please select a valid option.";
                return;
            }

            const inputEl = document.getElementById('email');
            const textValue = inputEl.value.trim();
            // 2. Check if the string is empty
            if (textValue === '') {
              output.textContent = `You selected: ${selectedValue} but email is missing`;
            } else 
            {
              output.textContent = `Validating System for: ${selectedValue}  and  ${textValue}`;
            }                 

            // Data to send for validation
            const verificationRequest = {
              selectedRole: selectedValue,
              textEmail: textValue
            };

            // Execute the HTTP POST request
            fetch(SIGNIN_URL, {
              method: 'POST',
              headers: {
                'Content-Type': 'application/json' // Essential: tells FastAPI to parse body as JSON
              },
              body: JSON.stringify(verificationRequest) // Convert JS object to JSON string
            })
              .then(response => {
                if (!response.ok) {
                  throw new Error(`HTTP error! status: ${response.status}`);
                }
                return response.json();
              })
              .then(data => {


                if ( data.message  === null){
                  output.textContent = `Email  ${textValue} not found`;
                }  else

                if ( data.message.admin_id ==  verificationRequest.selectedRole) {
                  output.textContent = `Found email: ${textValue} and account: ${selectedValue}`;
                  window.appStatus = {selectedValue};
                  alert(`Found email: ${textValue} and account: ${selectedValue}.   Loading...`);
                  handleLoginSuccess(window.appStatus);
                }
            })
              .catch(error => {
                output.textContent = `Internal Error.    Email  ${textValue} not found`;
                console.error('Validation request failed:', error);
              });


        });
        if ((textValue != '') && (selectedValue === '')) {
              output.textContent = `Choose Account for email: ${textValue}.`;
              button.disable = true;
        }
        button.textContent = "Select Account Below";

    } catch (error) {
        output.classList.add("error");
        output.textContent = `Error connecting to API: ${error.message}`;
    }
});




async function requestIt( url, options={})
{
    const answer = await fetch( url, options );
    if (!answer.ok) {
      throw new Error('HTTP Error status: ${answer.status}');
    }        
    return await answer.json()
}

async function loadTeacherDashboardData() {
    try {
        // Fetches concurrently instead of waiting for each one sequentially
       const [resCurr,resSubj,resPrer,resMat,resPost,resPag,resLess,resStud,resTeach] 
        = await Promise.all
       ( 
        [requestIt(CURRICULUM_URL),
        requestIt(SUBJECT_URL),
        requestIt(PREREQUISITE_URL),
        requestIt(MATERIAL_URL),
        requestIt(POSTER_URL),
        requestIt(PAGE_URL),
        requestIt(LESSON_URL),
        requestIt(STUDENT_URL),
        requestIt(TEACHER_URL)]
       );

      stateTeacher.setOptions(resTeach);
      stateStudent.setOptions(resStud);
      stateSubject.setOptions(resSubj);
      stateLesson.setOptions(resLess);


    } catch (error) {
        handleGlobalError(error);
    }
}


function handleGlobalError(error) {
    // 1. Log details to terminal/console for debugging
    console.error("[Global Error Caught]:", error);

    // 2. Display a user-friendly UI message (e.g., a toast notification or banner)
    output.textContent = `GlobalErrorHandler: ${error.message}`;
}

// Define your screen templates/render functions
function renderLoginScreen() {
  return `
    <main id="app">
    <h2>Montessori Sign In</h2>

    <label for="email">Enter account email. Then choose your account:</label>
    <input type="email" id="email" autocomplete="on" pattern=".+@example\.com" size="30" required />

    <button id="fetchBtn" type="button" class="btn" style="margin: 15px;">Refresh List</button>
    
    <div id="output"></div>
   
    <!-- Container where the select element will be placed -->
    <div id="select-div"></div>

    </main>
  `;
}



// Function to update the view
function navigateTo(screenHtml, setupCallback) {
  // 1. Parse the template string into an in-memory DOM Tree
  const parser = new DOMParser();
  const doc = parser.parseFromString(screenHtml, 'text/html');
  const newScreen = doc.body.firstElementChild;

  // 2. Access/Modify the DOM nodes in memory BEFORE rendering
  if (setupCallback) {
    setupCallback(newScreen);
  }

  // 3. Clear body and mount the new screen to document.body
  //document.body.innerHTML = '';
  //document.body.appendChild(newScreen);
}


// Generic helper function to populate <select> options
function populateSelect(selectElement, items, valueKey, textKey) {
  console.log('Populating element:', selectElement);
  console.log('Received items array:', items);

  if (!selectElement) {
    console.error('populateSelect target element is null!');
    return;
  }

  if (!Array.isArray(items) || items.length === 0) {
    console.warn('populateSelect received an empty or non-array items argument:', items);
    return;
  }

  items.forEach(item => {
    console.log(`Key check -> value: item['${valueKey}'] =`, item[valueKey], `| text: item['${textKey}'] =`, item[textKey]);
    
    const option = document.createElement('option');
    option.value = item[valueKey] !== undefined ? item[valueKey] : '';
    option.textContent = item[textKey] !== undefined ? item[textKey] : '';
    selectElement.appendChild(option);
  });
}



async function handleLoginSuccess(user) {

  await loadTeacherDashboardData();  // Call fastapi for data from HTTP

  // Render HTML string for teacher dashboard
  const dashboardHtml = renderDashboardScreen(user);

  // Pass a setup callback to configure elements before display
  navigateTo(dashboardHtml, (screenDom) => {
    // Both screens/data are accessible here!
    document.body.innerHTML = dashboardHtml;

    // DOM Elements
    const teacherSelect = document.getElementById('teacher-select');
    const studentSelect = document.getElementById('student-select');
    const subjectSelect = document.getElementById('subject-select');
    const lessonSelect = document.getElementById('lesson-select');
    const loadLessonsBtn = document.getElementById('load-lessons-btn');
    const lessonDisplay = document.getElementById('lesson-content-display');
    stateTeacher.container = teacherSelect;
    stateStudent.container = studentSelect;
    stateSubject.container = subjectSelect;
    stateLesson.container = lessonSelect;

    populateSelect(stateTeacher.container, stateTeacher.getOptions(), 'teacher_id', 'first_name');
    populateSelect(stateStudent.container, stateStudent.getOptions(), 'student_id', 'first_name');
    populateSelect(stateSubject.container, stateSubject.getOptions(), 'subject_id', 'name');

    // 2. Listener for Teacher element selection change
    teacherSelect.addEventListener('change', (event) => {
      const selectedTeacherId = event.target.value;
      console.log(`Teacher selected ID: ${selectedTeacherId}`);
      // Custom logic or API re-fetch can be triggered here on teacher change
    });

    // 3. Button Listener targeting Student selection to update Lesson content
    loadLessonsBtn.addEventListener('click', () => {
      const selectedStudentId = studentSelect.value;
      if (!selectedStudentId) {
        alert("Please select a student first.");
        return;
      }

      // Clear and populate lessons dropdown
      lessonSelect.innerHTML = '<option value="">Select a Lesson...</option>';
      populateSelect(lessonSelect, stateLesson.getOptions(), 'lesson_id', 'title');

      // Dynamically update the lesson content area for the chosen student
      const studentName = studentSelect.options[studentSelect.selectedIndex].text;
      lessonDisplay.innerHTML = `
        <strong>Assigned Lessons for ${studentName}:</strong>
        <ul>
          ${stateLesson.getOptions().map(l => `<li><strong>${l.title}:</strong> ${l.content}</li>`).join('')}
        </ul>
      `;
    }); // end of event listener on the loadLessons button
  }); // end of navigate to

} // end of handleLoginSuccess

</script>
